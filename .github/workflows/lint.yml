---
# CI on the GitHub mirror. The collection is developed on git.cmdln.it, where
# .gitea/workflows/lint.yml runs the same checks: keep the two in step.
name: Lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_CORE_VERSION: "2.20.4"
  ANSIBLE_LINT_VERSION: "26.4.0"

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and ansible-lint
        run: |
          pip install --quiet \
            "ansible-core==$ANSIBLE_CORE_VERSION" \
            "ansible-lint==$ANSIBLE_LINT_VERSION"

      # ansible-lint requires the collection to live at the canonical
      # namespace path; a symlink avoids duplicating the checkout.
      - name: Install collection dependencies and expose the collection
        run: |
          coll="$RUNNER_TEMP/collections"
          mkdir -p "$coll/ansible_collections/lineadicomando"
          ln -sfn "$GITHUB_WORKSPACE" \
            "$coll/ansible_collections/lineadicomando/win_workman"
          ansible-galaxy collection install -p "$coll" -r requirements.yml
          echo "ANSIBLE_COLLECTIONS_PATH=$coll" >> "$GITHUB_ENV"

      - name: Show versions
        run: |
          python3 --version
          ansible --version
          ansible-lint --version

      - name: Run ansible-lint
        run: ansible-lint --profile production
