---
# Win Workman task dispatcher.
# Invokable by FQCN: ansible-playbook lineadicomando.win_workman.win_workman
# The task list is passed as extra-vars (JSON):
#
#   ansible-playbook lineadicomando.win_workman.win_workman \
#     -e '{"todo": "chrome,chrome-info"}'
#
# todo: task strings, as a comma-separated string (e.g. "chrome",
#       "chrome-off,vlc-on") or a list.
# t:    the old name of todo, still accepted; todo wins when both are given.

- name: Win Workman dispatcher
  hosts: all
  gather_facts: false
  vars:
    todo: "{{ t | default('') }}"
    todo_list: "{{ todo.split(',') | map('trim') | select | list if todo is string else todo }}"
  tasks:
    - name: Run win_workman tasks
      ansible.builtin.import_role:
        name: lineadicomando.win_workman.dispatcher
      vars:
        win_workman_tasks: "{{ todo_list }}"
      when:
        - todo_list | length > 0
