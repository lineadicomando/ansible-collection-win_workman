---
display_name: "Audacity"
notes: >
  Audacity 4.x, the new major line: MSI package (3.x and earlier are Inno Setup),
  x86_64 only — upstream also publishes an arm64 MSI, which this role does not cover.
  Installed under %ProgramFiles%\Audacity 4. Two things the installer does not do on
  its own: it declares no ALLUSERS, so the role passes ALLUSERS=1 or the shortcuts land
  in the profile of the connecting Ansible user instead of being visible to everyone;
  and its UpgradeCode supersedes only the 4.x line, so `on` first uninstalls any
  Audacity matching win_workman_audacity_superseded_searchnames (1.x, 2.x, 3.x by
  default), which would otherwise stay installed alongside it. `off` removes only 4.x.
