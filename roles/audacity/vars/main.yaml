# ==============================================================================
#  Software Information:
#      - Name:        Audacity
#      - Homepage:    https://www.audacityteam.org
#      - Download:    https://github.com/audacity/audacity/releases/
# ==============================================================================
---
# Audacity 3.x and earlier are Inno Setup packages, registered under the
# Audacity_is1 key with the version inside the DisplayName ("Audacity 3.7.9").
# The 4.x MSI carries its own UpgradeCode and supersedes only itself, so those
# releases would otherwise sit alongside it; `on` removes them first. One glob per
# superseded line: add "Audacity 4*" here if a 5.x line ever replaces this one.
win_workman_audacity_superseded_searchnames:
  - "Audacity 1*"
  - "Audacity 2*"
  - "Audacity 3*"

# Inno Setup silent uninstall switches, used against the UninstallString that
# pkg_utils reads from the registry entry it finds.
win_workman_audacity_superseded_uninstall_args:
  - /VERYSILENT
  - /NORESTART
  - /SUPPRESSMSGBOXES

win_workman_audacity_schema:
  name: Audacity
  role: lineadicomando.win_workman.audacity
  default_action: !!str on
  package:
    setup_file: audacity-win-4.0.0-x86_64.msi
    provider: msi
    searchName: "Audacity 4*"
    version: "4.0.0.262451524"
    # The MSI declares no ALLUSERS, so DesktopFolder and ProgramMenuFolder resolve
    # to the profile of the connecting user and only that user gets the shortcuts,
    # even though the uninstall entry lands in HKLM. Forcing it puts them under
    # %Public%\Desktop and %ProgramData%, which is what a lab needs.
    install_args:
      - ALLUSERS=1
  files:
    - filename: audacity-win-4.0.0-x86_64.msi
      url: https://github.com/audacity/audacity/releases/download/Audacity-4.0.0/audacity-win-4.0.0-x86_64.msi
      checksum: sha256:2aecc44d28a004d15ae7c23c099f232ba8c5b3e6b19ebdbaf7d6c596316dc5b3
