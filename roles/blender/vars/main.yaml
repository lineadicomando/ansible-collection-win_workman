win_workman_blender_schema:
  name: Blender
  role: lineadicomando.win_workman.blender
  default_action: !!str on
  package:
    setup_file: blender-5.3.0-windows-x64.msi
    # Every Blender MSI has DisplayName "Blender", but the UpgradeCode changes
    # with each minor series (5.2 and 5.3 differ), so a new series installs next
    # to the old one instead of replacing it. version_like tells this series
    # apart, exclusive removes the other ones before installing. Move it along
    # with the version at every series bump.
    searchName: "Blender"
    version: "5.3.0"
    version_like: "5.3*"
    exclusive: true
    product_id: "{BCCBDF6A-9448-4838-944B-2CB9539D572E}"
  files:
