---
display_name: Check Disk (chkdsk)
custom_actions:
  - name: "on"
    description: Run an online scan (chkdsk /scan) on target volumes and report the outcome
defaults:
  - var: win_workman_chkdsk_volumes
    type: list
    default: ["C"]
    description: Drive letters to scan
notes: "The scan runs at once with the volume in use: no restart, and nothing is scheduled for the next boot. It only detects: a volume with errors fails the task and still needs an offline repair (chkdsk /spotfix or /f)."
