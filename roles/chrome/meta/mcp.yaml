---
display_name: Google Chrome
custom_actions:
  - name: privacy
    description: >-
      Requires an 'on' or 'off' argument (chrome-privacy-on). Applies or removes
      lockdown policies under HKLM\SOFTWARE\Policies\Google\Chrome. 'on'
      disables sign-in, sync, guest mode, profile creation, password manager,
      autofill, telemetry and extension installs, and clears cookies, cache and
      history on browser exit. 'off' removes those policies. Does not delete
      existing profile data.
  - name: rm
    description: >-
      Requires the 'profile' argument (chrome-rm-profile). Force-closes Chrome,
      then deletes AppData\Local\Google\Chrome for every local user profile on
      the host and removes per-profile Chrome desktop shortcuts. Affects all
      local users, not a single one.
defaults:
  - var: win_workman_chrome_shortcuts
    type: bool
    default: false
    description: Create shortcuts on Desktop and Start Menu
  - var: win_workman_chrome_shortcut_url
    type: str
    default: ""
    description: Default URL to open; empty means default new tab
  - var: win_workman_chrome_shortcut_no_first_run
    type: bool
    default: true
    description: Pass --no-first-run --no-default-browser-check flags to shortcut
notes: "Accepts '32bit' task argument. Closes running Chrome before install/uninstall."
