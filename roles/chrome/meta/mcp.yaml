---
display_name: Google Chrome
custom_actions:
  - name: privacy
    description: >-
      Requires an 'on' or 'off' argument (chrome-privacy-on). Applies or removes
      lockdown policies under HKLM\SOFTWARE\Policies\Google\Chrome. 'on'
      disables sign-in, sync, guest mode, profile creation, password manager,
      autofill, telemetry and extension installs (the last one
      unless win_workman_chrome_block_extensions is false), force-installs the
      extensions in win_workman_chrome_extension_forcelist, and clears cookies,
      cache and history on browser exit. 'off' removes those policies. Does not delete
      existing profile data.
  - name: rm
    description: >-
      Requires the 'profile' argument (chrome-rm-profile). Force-closes Chrome,
      then deletes AppData\Local\Google\Chrome for every local user profile on
      the host and removes per-profile Chrome desktop shortcuts. Affects all
      local users, not a single one.
defaults:
  - var: win_workman_chrome_shortcuts
    type: bool
    default: false
    description: Create shortcuts on Desktop and Start Menu
  - var: win_workman_chrome_shortcut_url
    type: str
    default: ""
    description: Default URL to open; empty means default new tab
  - var: win_workman_chrome_shortcut_no_first_run
    type: bool
    default: true
    description: Pass --no-first-run --no-default-browser-check flags to shortcut
  - var: win_workman_chrome_block_extensions
    type: bool
    default: true
    description: >-
      With chrome-privacy-on, block installation of all extensions
      (ExtensionInstallBlocklist = *). Set to false to apply the other privacy
      policies and leave extension installs allowed.
  - var: win_workman_chrome_extension_allowlist
    type: list
    default: []
    description: >-
      With chrome-privacy-on and extensions blocked, IDs of the extensions
      users may still install from the Chrome Web Store
      (ExtensionInstallAllowlist). E.g. ghbmnnjooekpmoecnnnilnnbdlolhkhi for
      Google Docs Offline, which the context-menu copy and paste in Docs and
      Sheets relies on. Users still have to install them; see
      win_workman_chrome_extension_forcelist to install them for everyone.
  - var: win_workman_chrome_extension_forcelist
    type: list
    default: []
    description: >-
      With chrome-privacy-on, extensions Chrome installs by itself for every
      user, who cannot remove them (ExtensionInstallForcelist). They are
      installed whether or not the other extensions are blocked. An entry is
      an extension ID, taken from the Chrome Web Store, or "<id>;<update URL>".
      E.g. ghbmnnjooekpmoecnnnilnnbdlolhkhi for Google Docs Offline.
  - var: win_workman_chrome_clear_site_data_on_exit
    type: bool
    default: true
    description: >-
      With chrome-privacy-on, clear cookies and site data when Chrome closes.
      Set to false to keep Google sign-ins and offline data between sessions;
      cache and history are cleared either way.
notes: "Accepts '32bit' task argument. Closes running Chrome before install/uninstall."
