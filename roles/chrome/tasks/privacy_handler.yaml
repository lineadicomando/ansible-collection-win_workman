---
- name: Set root key
  ansible.builtin.set_fact:
    win_workman_chrome_policy_path: HKLM:\SOFTWARE\Policies\Google\Chrome

- name: Create the Chrome base policy key
  ansible.windows.win_regedit:
    path: "{{ win_workman_chrome_policy_path }}"
    state: present
  when: win_workman_chrome_policy_enabled

- name: Set Chrome policy values
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    data: "{{ item.data }}"
  loop:
    # Disable sign-in with a Google account in the browser.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserSignin
      type: dword
      data: 0
    # Disable profile and data sync.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: SyncDisabled
      type: dword
      data: 1
    # Prevent users from adding new Chrome profiles via the profile menu (avatar button).
    # https://chromeenterprise.google/policies/#BrowserAddPersonEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserAddPersonEnabled
      type: dword
      data: 0
    # Hide the profile picker at startup; Chrome opens the default profile directly.
    # Values: 0 = available (default), 1 = disabled, 2 = forced always shown.
    # https://chromeenterprise.google/policies/#ProfilePickerOnStartupAvailability
    - path: "{{ win_workman_chrome_policy_path }}"
      name: ProfilePickerOnStartupAvailability
      type: dword
      data: 1
    # Disable guest browsing mode, which creates an anonymous temporary profile with no
    # persistent data and bypasses the normal profile restrictions above.
    # https://chromeenterprise.google/policies/#BrowserGuestModeEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserGuestModeEnabled
      type: dword
      data: 0
    # Disable the first run experience.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: HideFirstRunExperience
      type: dword
      data: 1
    # Disable the import wizard at first run.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: ImportAtFirstRun
      type: dword
      data: 0
    # Disable password saving.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: PasswordManagerEnabled
      type: dword
      data: 0
    # Disable address autofill.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: AutofillAddressEnabled
      type: dword
      data: 0
    # Disable credit card autofill.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: AutofillCreditCardEnabled
      type: dword
      data: 0
    # Disable optional telemetry.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: MetricsReportingEnabled
      type: dword
      data: 0
    # Disable personalization/diagnostics.
    - path: "{{ win_workman_chrome_policy_path }}"
      name: PersonalizationReportingEnabled
      type: dword
      data: 0
  when: win_workman_chrome_policy_enabled

# Block installation of all extensions, unless the host opts out with
# win_workman_chrome_block_extensions: false.
# https://chromeenterprise.google/policies/#ExtensionInstallBlocklist
- name: Block installation of all extensions
  ansible.windows.win_regedit:
    path: "{{ win_workman_chrome_policy_path }}\\ExtensionInstallBlocklist"
    name: "1"
    type: string
    data: "*"
  when: win_workman_chrome_policy_enabled and win_workman_chrome_block_extensions | bool

- name: Remove the extension blocklist
  ansible.windows.win_regedit:
    path: "{{ win_workman_chrome_policy_path }}\\ExtensionInstallBlocklist"
    state: absent
  when: not (win_workman_chrome_policy_enabled and win_workman_chrome_block_extensions | bool)

# Extensions that stay installable from the Web Store despite the blocklist.
# Without the blocklist everything is installable, so the allowlist is dropped.
# https://chromeenterprise.google/policies/#ExtensionInstallAllowlist
- name: Set the extension allowlist
  ansible.builtin.include_tasks: list_policy.yaml
  vars:
    win_workman_chrome_list_key: "{{ win_workman_chrome_policy_path }}\\ExtensionInstallAllowlist"
    win_workman_chrome_list_items: >-
      {{ win_workman_chrome_extension_allowlist
         if win_workman_chrome_policy_enabled and win_workman_chrome_block_extensions | bool
         else [] }}

# Extensions Chrome installs by itself for every user, who cannot remove them.
# They are installed even when every other extension is blocked. An entry is
# an extension ID (from the Chrome Web Store) or "<id>;<update URL>".
# https://chromeenterprise.google/policies/#ExtensionInstallForcelist
- name: Set the force-installed extensions
  ansible.builtin.include_tasks: list_policy.yaml
  vars:
    win_workman_chrome_list_key: "{{ win_workman_chrome_policy_path }}\\ExtensionInstallForcelist"
    win_workman_chrome_list_items: >-
      {{ win_workman_chrome_extension_forcelist
         if win_workman_chrome_policy_enabled
         else [] }}

# Browsing data cleared when Chrome closes. Cookies and site data are kept
# when the host opts out with win_workman_chrome_clear_site_data_on_exit: false.
# https://chromeenterprise.google/policies/#ClearBrowsingDataOnExitList
- name: Set the data cleared on exit
  ansible.builtin.include_tasks: list_policy.yaml
  vars:
    win_workman_chrome_list_key: "{{ win_workman_chrome_policy_path }}\\ClearBrowsingDataOnExitList"
    win_workman_chrome_list_items: >-
      {{ ((['cookies_and_other_site_data'] if win_workman_chrome_clear_site_data_on_exit | bool else [])
          + ['cached_images_and_files', 'browsing_history'])
         if win_workman_chrome_policy_enabled
         else [] }}

- name: Remove Chrome policy values (restore)
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    state: absent
  loop:
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserSignin
    - path: "{{ win_workman_chrome_policy_path }}"
      name: SyncDisabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserAddPersonEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: ProfilePickerOnStartupAvailability
    - path: "{{ win_workman_chrome_policy_path }}"
      name: BrowserGuestModeEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: HideFirstRunExperience
    - path: "{{ win_workman_chrome_policy_path }}"
      name: ImportAtFirstRun
    - path: "{{ win_workman_chrome_policy_path }}"
      name: PasswordManagerEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: AutofillAddressEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: AutofillCreditCardEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: MetricsReportingEnabled
    - path: "{{ win_workman_chrome_policy_path }}"
      name: PersonalizationReportingEnabled
  when: not win_workman_chrome_policy_enabled

- name: Remove the Chrome base policy key (restore)
  ansible.windows.win_regedit:
    path: "{{ win_workman_chrome_policy_path }}"
    state: absent
  when: not win_workman_chrome_policy_enabled
