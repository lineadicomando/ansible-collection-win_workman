---
# The remote temporary directories must be usable by SYSTEM too
# (pkg_utils/remote_tmp.yaml explains why). dispatch_task.yaml sets their ACL once
# per dispatcher run, right before the first task that connects to the host: a
# leading wol runs on the controller and must not need the host to be up already.
- name: Reset the remote temporary directory flag
  ansible.builtin.set_fact:
    _win_workman_remote_tmp_done: false

- name: Dispatch each task to its schema role
  ansible.builtin.include_tasks: dispatch_task.yaml
  loop: "{{ _win_workman_tasks_parsed }}"
  loop_control:
    loop_var: _wm_item
    label: "{{ _wm_item.task }}"
