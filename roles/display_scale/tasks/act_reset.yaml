---
- name: Logoff interactive sessions
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: logoff
  when: win_workman_display_scale_profiles_target is not defined

- name: Ensure display scale target profiles are collected
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.display_scale
    tasks_from: display_scale_profiles
  when:
    - win_workman_display_scale_profiles_target is not defined

- name: Drop per-monitor scale overrides
  ansible.windows.win_regedit:
    hive: "{{ (item.HiveMounted | default(false) | bool) | ternary(omit, item.HivePath) }}"
    path: "{{ item.HiveRoot ~ (win_workman_display_scale_per_monitor_path | replace('HKLM:\\ANSIBLE', '')) }}"
    state: absent
    delete_key: true
  loop: "{{ win_workman_display_scale_profiles_target }}"
  loop_control:
    label: "{{ item.LocalPath }}"

- name: Restore the display-recommended scale in offline profiles and the Default profile
  ansible.windows.win_regedit:
    hive: "{{ (item.0.HiveMounted | default(false) | bool) | ternary(omit, item.0.HivePath) }}"
    path: "{{ item.0.HiveRoot ~ (item.1.path | replace('HKLM:\\ANSIBLE', '')) }}"
    name: "{{ item.1.name }}"
    state: absent
  loop: "{{ win_workman_display_scale_profiles_target | product(win_workman_display_scale_registry_entries_reset) | list }}"
  loop_control:
    label: "{{ item.0.LocalPath }} -> {{ item.1.name }}"
