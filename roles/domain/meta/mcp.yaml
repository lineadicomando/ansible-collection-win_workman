---
display_name: Active Directory Domain Membership
custom_actions:
  - name: status
    description: Report whether the host is joined to a domain or in a workgroup, and which (default, read-only)
  - name: join
    description: Join the domain win_workman_domain_name, after pointing DNS at win_workman_domain_dns_servers
  - name: leave
    description: Leave the domain for the workgroup win_workman_domain_workgroup (the computer account is disabled, not deleted)
  - name: "on"
    description: Alias for join
  - name: "off"
    description: Alias for leave
defaults:
  - var: win_workman_domain_name
    type: str
    default: ""
    description: DNS name of the AD domain, e.g. example.com (required by join and leave)
  - var: win_workman_domain_admin_user
    type: str
    default: Administrator
    description: Domain account that joins the computer, or disables its account on leave (used as user@win_workman_domain_name)
  - var: win_workman_domain_admin_password
    type: str
    default: ""
    description: Password of the domain account; a secret, from a vault-encrypted variable (required by join and leave)
  - var: win_workman_domain_dns_servers
    type: list
    default: []
    description: DNS servers set on every adapter before joining (the domain controllers); empty leaves the adapters as they are
  - var: win_workman_domain_workgroup
    type: str
    default: WORKGROUP
    description: Workgroup the host moves to on leave
  - var: win_workman_domain_reboot
    type: bool
    default: true
    description: Reboot the host when join or leave requires it
  - var: win_workman_domain_set_fact
    type: bool
    default: true
    description: "status: publish the result as the win_workman_domain_status fact (hostname, part_of_domain, domain, workgroup)"
notes: >-
  Join and leave use microsoft.ad.membership and reboot the host when needed.
  Pass win_workman_domain_admin_password as a secret, never in extra_vars.
