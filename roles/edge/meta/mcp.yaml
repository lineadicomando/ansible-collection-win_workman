---
display_name: Microsoft Edge
custom_actions:
  - name: "off"
    description: >-
      Not implemented: it accepts the action and does nothing. Edge cannot be
      uninstalled because Windows components depend on it; removing it leaves
      the system unstable (verified on a lab machine).
  - name: privacy
    description: >-
      Requires an 'on' or 'off' argument (edge-privacy-on). Applies or removes
      lockdown policies under HKLM\SOFTWARE\Policies\Microsoft\Edge. 'on'
      disables sign-in, sync, password manager, autofill, history saving,
      telemetry and extension installs (except win_workman_edge_extension_allowlist),
      force-installs the extensions in win_workman_edge_extension_forcelist,
      and clears browsing data on exit. 'off' removes those policies. Does not
      delete existing profile data.
  - name: rm
    description: Remove the Edge profile directory for a specific user
defaults:
  - var: win_workman_edge_shortcuts
    type: bool
    default: false
    description: Create shortcuts on Desktop and Start Menu
  - var: win_workman_edge_shortcut_url
    type: str
    default: ""
    description: Default URL to open; empty means default new tab
  - var: win_workman_edge_shortcut_no_first_run
    type: bool
    default: true
    description: Pass --no-first-run flags to shortcut
  - var: win_workman_edge_extension_allowlist
    type: list
    default: []
    description: >-
      With edge-privacy-on, IDs of the extensions users may still install
      despite the blocklist (ExtensionInstallAllowlist). IDs are looked up in
      the Edge Add-ons store; one from the Chrome Web Store also needs the
      user to turn on "Allow extensions from other stores".
  - var: win_workman_edge_extension_forcelist
    type: list
    default: []
    description: >-
      With edge-privacy-on, extensions Edge installs by itself for every user,
      who cannot remove them (ExtensionInstallForcelist), despite the
      blocklist. An entry is "<id>;<update URL>"; a bare ID is looked up in
      the Edge Add-ons store. For a Chrome Web Store extension add
      ";https://clients2.google.com/service/update2/crx", e.g.
      ghbmnnjooekpmoecnnnilnnbdlolhkhi;https://clients2.google.com/service/update2/crx
      for Google Docs Offline.
notes: >-
  Accepts '32bit' task argument. Closes running Edge before install.
  This role installs and upgrades Edge but never removes it: see the 'off'
  action.
