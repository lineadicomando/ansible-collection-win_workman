---
display_name: Mozilla Firefox
custom_actions:
  - name: privacy
    description: >-
      Requires an 'on' or 'off' argument (firefox-privacy-on). Applies or
      removes lockdown policies under HKLM\SOFTWARE\Policies\Mozilla\Firefox.
      'on' disables Firefox Accounts, profile import, password saving and
      manager, autofill and telemetry, blocks all extensions, sets the first
      run page to about:blank, and clears cookies, cache and history on
      shutdown (locked). 'off' removes those policies. Does not delete
      existing profile data.
  - name: rm
    description: >-
      Requires the 'profile' argument (firefox-rm-profile). Force-closes
      Firefox, then deletes AppData\Local\Mozilla\Firefox and
      AppData\Roaming\Mozilla\Firefox for every local user profile on the
      host. Affects all local users, not a single one.
defaults:
  - var: win_workman_firefox_shortcuts
    type: bool
    default: false
    description: Create shortcuts on Desktop and Start Menu
  - var: win_workman_firefox_shortcut_url
    type: str
    default: ""
    description: Default URL to open; empty means default new tab
  - var: win_workman_firefox_private
    type: bool
    default: false
    description: Add --private-window to the shortcut
  - var: win_workman_firefox_kiosk
    type: bool
    default: false
    description: Add --kiosk to the shortcut
notes: >-
  Accepts the '32bit' task argument and a language token (firefox-on-de,
  firefox-on-en_GB); without a token the language is detected from the host
  locale, falling back to win_workman_default_lang. Does not close a running
  Firefox before install or uninstall.
