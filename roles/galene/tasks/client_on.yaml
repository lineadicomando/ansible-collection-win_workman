---
- name: Require the Galène master
  ansible.builtin.assert:
    that:
      - win_workman_galene_master_host | length > 0
      - win_workman_galene_master_host != inventory_hostname
    fail_msg: >-
      No Galène master for {{ inventory_hostname }}: set win_workman_galene_master_host
      to the inventory name of the teacher PC (default: the first host of 'teachers'),
      or run galene-on-master if this host is the master.
    quiet: true

- name: Client shortcut on the public desktop
  community.windows.win_shortcut:
    src: "{{ win_workman_galene_browser }}"
    arguments: "--app={{ win_workman_galene_client_url }}"
    dest: "{{ win_workman_galene_client_shortcut_path }}"
    icon: "{{ win_workman_galene_browser }},0"
    description: "{{ win_workman_galene_client_shortcut_description }}"
    state: present
