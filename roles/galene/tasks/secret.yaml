---
# Once per play: with several hosts reading the lookup at the same time, the
# first run on an inventory could create the file twice with two secrets.
- name: Read or create the Galène secret on the controller
  ansible.builtin.set_fact:
    win_workman_galene_secret: >-
      {{ lookup('ansible.builtin.password', win_workman_galene_secret_file,
                chars=['ascii_letters', 'digits'], length=40) }}
  run_once: true
  no_log: true
