---
- name: Validate win_workman_gcpw_domains_allowed_to_login
  ansible.builtin.fail:
    msg: >-
      win_workman_gcpw_domains_allowed_to_login is required for the 'on' action
      and must be a valid domain or comma-separated list of domains
      (e.g. 'example.com' or 'school.edu,other.edu').
      Current value: '{{ win_workman_gcpw_domains_allowed_to_login | default("") }}'
  when:
    - (win_workman_task.act | default('on', true)) == 'on'
    - not (win_workman_gcpw_domains_allowed_to_login | default('') | string | trim)
      or not (win_workman_gcpw_domains_allowed_to_login | default('') | regex_search('^[a-zA-Z0-9][a-zA-Z0-9\-]*\.[a-zA-Z]{2,}'))

