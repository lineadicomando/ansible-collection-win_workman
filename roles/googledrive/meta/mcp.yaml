---
display_name: "Google Drive"
defaults:
  - var: win_workman_googledrive_desktop_shortcut
    type: bool
    default: true
    description: Create the Google Drive shortcut on the public desktop
  - var: win_workman_googledrive_auto_start
    type: bool
    default: true
    description: On 'on', set HKLM\Software\Google\DriveFS AutoStartOnLogin to 1
notes: >-
  'on' installs chrome first (googledrive-on-nodep skips it). No version is pinned:
  every 'on' runs the current GoogleDriveSetup.exe again and accepts exit code 1638
  (already installed); Drive updates itself. The installer in storage has no checksum
  and is never re-downloaded once present: delete it to deploy a newer build. 'off'
  leaves the AutoStartOnLogin value in place.
