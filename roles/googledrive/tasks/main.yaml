---
# win_workman_dep: lineadicomando.win_workman.chrome
- name: Install chrome
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.chrome
  vars:
    win_workman_action: "on"
  when:
    - win_workman_action | default('on', true) == 'on'
    - "'nodep' not in (win_workman_task_argv | default([]))"

- name: Dispatch to package workflow
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pkg_workflow
  vars:
    win_workman_schema: "{{ win_workman_googledrive_schema }}"

- name: Configure Google Drive auto-start at login
  ansible.windows.win_regedit:
    path: HKLM:\Software\Google\DriveFS
    name: AutoStartOnLogin
    type: dword
    data: 1
  when:
    - win_workman_action | default('on', true) == 'on'
    - win_workman_googledrive_auto_start | default(true) | bool
