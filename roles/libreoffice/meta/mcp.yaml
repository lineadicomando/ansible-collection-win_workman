---
display_name: LibreOffice
custom_actions:
  - name: rm_data
    description: >-
      Force-close soffice.bin and delete AppData\Roaming\LibreOffice in every local
      profile (resets per-user settings for all users)
notes: >-
  Accepts the 'fresh' task argument with any standard action (libreoffice-on-fresh,
  libreoffice-info-fresh, libreoffice-download-fresh):
  targets the Fresh branch instead of the default Still branch. Still is the
  branch The Document Foundation recommends for institutional deployments.
