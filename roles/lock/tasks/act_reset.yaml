---
# Unlocks without a saved state to go by: for a host left with logon
# restricted and its saved state lost. Whatever the host had before the lock
# is not known here, so each setting goes to its Windows default.
- name: Validate the fallback users
  ansible.builtin.assert:
    that:
      - win_workman_mode_interactive_logon_fallback_users is not string
      - win_workman_mode_interactive_logon_fallback_users | length > 0
    fail_msg: "lock-reset needs a non-empty win_workman_mode_interactive_logon_fallback_users"
    quiet: true

- name: Clear the legal notice
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: "{{ item }}"
    data: ""
    type: string
    state: present
  loop:
    - LegalNoticeCaption
    - LegalNoticeText

- name: Remove DontDisplayLastUserName
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: DontDisplayLastUserName
    state: absent

- name: Set SeInteractiveLogonRight to the fallback users
  ansible.windows.win_user_right:
    name: SeInteractiveLogonRight
    users: "{{ win_workman_mode_interactive_logon_fallback_users }}"
    action: set

# The flags first: they are what marks a value as saved
- name: Remove the saved state
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Ansible\WinMaint
    name: "{{ item }}"
    state: absent
  loop:
    - LegalNoticeCaptionExists
    - LegalNoticeTextExists
    - LegalNoticeCaption
    - LegalNoticeText
    - DontDisplayLastUserName
    - SeInteractiveLogonRight
