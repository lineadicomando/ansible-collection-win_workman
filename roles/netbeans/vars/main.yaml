    install_args:
      - /VERYSILENT
      - /SUPPRESSMSGBOXES
      - /NORESTART
    uninstall_args:
      - /VERYSILENT
      - /SUPPRESSMSGBOXES
      - /NORESTART
  files:
    - filename: Apache-NetBeans-31.exe
      url: https://github.com/codelerity/netbeans-packages/releases/download/v31-build1/Apache-NetBeans-31.exe
      checksum: sha256:ac84c3f8d4afb07c75fa4e21ca7a85a4a1d5909157eb311cd3de52855462272d
