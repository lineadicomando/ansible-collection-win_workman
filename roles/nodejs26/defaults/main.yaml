---
# Allow node.exe through Windows Firewall: an inbound rule for the program, any
# protocol and port, from the local subnet only. 'on' also removes the rules the
# firewall prompt leaves ("Query User", block or allow) and any inbound block rule
# on node.exe. 'off' always removes the rule; with false, 'on' leaves the firewall
# alone.
win_workman_nodejs26_firewall: false
win_workman_nodejs26_firewall_profiles: [domain, private, public]
# Remote addresses allowed: LocalSubnet, Any, or a list of addresses/ranges.
win_workman_nodejs26_firewall_remoteip: LocalSubnet
