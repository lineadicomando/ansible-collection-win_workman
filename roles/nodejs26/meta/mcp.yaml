---
display_name: "Node.js 26 LTS"
defaults:
  - var: win_workman_nodejs26_firewall
    type: bool
    default: false
    description: On 'on', allow node.exe inbound and remove the rules left by the firewall prompt and any block rule
  - var: win_workman_nodejs26_firewall_profiles
    type: list
    default: [domain, private, public]
    description: Firewall profiles the rule applies to
  - var: win_workman_nodejs26_firewall_remoteip
    type: str
    default: LocalSubnet
    description: Allowed sources, LocalSubnet, Any, or a list of addresses/ranges
notes: >-
  One Node.js major line per host: every Node.js MSI shares the same UpgradeCode,
  so 'on' removes any other version (24, 27, ...) before installing 26, and 'off'
  removes only 26. 'on' also runs ps_policy-on (RemoteSigned, LocalMachine) so
  that npm and npx work from PowerShell; nodejs26-on-nodep skips it. The PATH of
  global npm packages (%APPDATA%\npm) is not added for the users. With
  win_workman_nodejs26_firewall true, 'on' adds an inbound allow rule for node.exe
  (any port, from win_workman_nodejs26_firewall_remoteip, LocalSubnet by default)
  and removes the rules the firewall prompt leaves (block or allow) and any other
  block rule on node.exe; 'off' always removes the rule. End of life 2029-04-30.
