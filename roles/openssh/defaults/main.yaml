---
# Each one falls back on the secure_ssh variable of the same name, so an inventory
# written for the old role keeps its overrides. Drop the fallbacks together with the
# secure_ssh alias role.
win_workman_openssh_manage_authorized_keys: "{{ win_workman_secure_ssh_manage_authorized_keys | default(true) }}"
win_workman_openssh_enable_pubkey_auth: "{{ win_workman_secure_ssh_enable_pubkey_auth | default(true) }}"
win_workman_openssh_disable_password_auth: "{{ win_workman_secure_ssh_disable_password_auth | default(true) }}"
win_workman_openssh_manage_allow_users: "{{ win_workman_secure_ssh_manage_allow_users | default(true) }}"
