---
- name: Optimize volumes
  ansible.windows.win_powershell:
    script: |
      param(
        [Parameter(Mandatory = $true)]
        [ValidatePattern('^[A-Z]$')]
        [string]$DriveLetter,

        [bool]$Defrag = $false
      )

      try {
        $params = @{
          DriveLetter  = $DriveLetter
          ErrorAction  = 'Stop'
        }

        if ($Defrag) {
          $params.Defrag = $true
        }

        # Optimize-Volume reports what it did only on the verbose stream,
        # progress included: "<step>:  33% ..." lines by the hundred
        $output = Optimize-Volume @params -Verbose 4>&1 | ForEach-Object { "$_".Trim() } |
          Where-Object { $_ -notmatch ':\s+\d+%\s' }

        $Ansible.Changed = $true
        $Ansible.Result  = @{
          Drive  = "$DriveLetter`:"
          Output = @($output | Where-Object { $_ })
        }
      } catch {
        $Ansible.Failed  = $true
        $Ansible.Changed = $false
        $Ansible.Result  = @{
          Drive  = "$DriveLetter`:"
          Error  = "Optimize-Volume failed on drive ${DriveLetter}: $($_.Exception.Message)"
          Output = @()
        }
      }
    parameters:
      DriveLetter: "{{ win_workman_optimize_volume }}"
      Defrag: "{{ win_workman_optimize_defrag | bool }}"
  loop: "{{ win_workman_optimize_volumes }}"
  loop_control:
    loop_var: win_workman_optimize_volume
    label: "{{ win_workman_optimize_volume }}:"
  register: win_workman_optimize_vol

- name: Show optimize results
  ansible.builtin.debug:
    msg: "{{ item.result.Drive }} | {{ item.result.Output | default([]) | join(' - ') | default('no output', true) }}"
  loop: "{{ win_workman_optimize_vol.results }}"
  loop_control:
    label: "{{ item.result.Drive }}"
