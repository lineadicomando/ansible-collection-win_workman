---
win_workman_remote_tmp: C:\Windows\Temp\ansible
win_workman_storage_path: "{{ lookup('env', 'HOME') }}/win_workman_storage"
win_workman_portable_path: C:\PortableApps
win_workman_default_lang: "en_US"

win_workman_mode_title: "Maintenance in progress"
win_workman_mode_text: |
  The system is currently undergoing maintenance.
  Contact IT for assistance.
win_workman_mode_force_logoff: true
win_workman_restart_timeout: 600
win_workman_restart: true

# Before win_package installs or uninstalls, wait up to this many seconds for
# Windows Installer and component servicing to be idle (see wait_installer).
win_workman_installer_wait_timeout: 900
# win_package return codes that mean Windows Installer was busy, not that the
# package is broken: 1601 service not accessible, 1618 another install running.
win_workman_installer_retry_codes: [1601, 1618]
win_workman_installer_retries: 3
win_workman_installer_retry_delay: 60

# After a successful uninstall, remove the install directory when nothing is
# left in it but the uninstaller's own files. Inno Setup cannot delete the
# running unins000.exe, so it always leaves one behind.
win_workman_cleanup_uninstaller_dir: true

# Per-user deferred install (usr action). See docs/roles/core/pkg_utils.md.
win_workman_usr_path: C:\ProgramData\win_workman\usr
# Users or groups a bare <schema>-usr-on applies to. Names, DOMAIN\name or SIDs.
win_workman_usr_targets:
  - BUILTIN\Users
# Seconds the agent waits for an installer or uninstaller.
win_workman_usr_timeout: 900
# Seconds usr-apply waits for the agent to finish in every targeted session.
win_workman_usr_apply_timeout: 900
