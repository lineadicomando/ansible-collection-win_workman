---
# Logs off every session that carries a user, then waits for them to end.
# Like user_sessions, every state counts, not only WTSActive: a user switched
# away from (fast user switching) or dropped from RDP is WTSDisconnected and
# still holds a loaded profile and open files. Session 0 (services, the Ansible
# SSH session) and system accounts are left out.
- name: Force logoff interactive sessions
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ win_workman_logoff_timeout_seconds }}"
    script: |
      param(
        [int]$TimeoutSeconds = 300
      )

      $Ansible.Changed = $false
      $Ansible.Failed = $false

      if (-not ('WinMgmtWtsLogoff' -as [type])) {
        Add-Type -ErrorAction Stop -TypeDefinition (@(
          'using System;',
          'using System.Runtime.InteropServices;',
          '[StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]',
          'public struct WinMgmtWtsLogoffEntry {',
          '  public int SessionId;',
          '  [MarshalAs(UnmanagedType.LPTStr)] public string WinStationName;',
          '  public int State;',
          '}',
          'public static class WinMgmtWtsLogoff {',
          '  [DllImport("wtsapi32.dll", SetLastError=true)]',
          '  public static extern bool WTSEnumerateSessions(IntPtr hServer, int reserved, int version, out IntPtr ppSessionInfo, out int count);',
          '  [DllImport("wtsapi32.dll")]',
          '  public static extern void WTSFreeMemory(IntPtr pMemory);',
          '  [DllImport("wtsapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)]',
          '  public static extern bool WTSQuerySessionInformation(IntPtr hServer, int sessionId, int infoClass, out IntPtr ppBuffer, out int bytesReturned);',
          '  [DllImport("wtsapi32.dll", SetLastError=true)]',
          '  public static extern bool WTSLogoffSession(IntPtr hServer, int sessionId, bool bWait);',
          '}'
        ) -join [Environment]::NewLine)
      }

      # WTS_CONNECTSTATE_CLASS and WTS_INFO_CLASS values
      $stateNames = 'Active', 'Connected', 'ConnectQuery', 'Shadow', 'Disconnected', 'Idle', 'Listen', 'Reset', 'Down', 'Init'
      $WTSUserName = 5
      $WTSDomainName = 7

      function Get-WtsText([int]$SessionId, [int]$InfoClass) {
        $buffer = [IntPtr]::Zero
        $bytes = 0
        try {
          if (-not [WinMgmtWtsLogoff]::WTSQuerySessionInformation([IntPtr]::Zero, $SessionId, $InfoClass, [ref]$buffer, [ref]$bytes) -or $bytes -le 2) {
            return ''
          }
          return [Runtime.InteropServices.Marshal]::PtrToStringUni($buffer)
        }
        finally {
          if ($buffer -ne [IntPtr]::Zero) { [WinMgmtWtsLogoff]::WTSFreeMemory($buffer) }
        }
      }

      function Get-UserSessions {
        $list = [IntPtr]::Zero
        $count = 0
        if (-not [WinMgmtWtsLogoff]::WTSEnumerateSessions([IntPtr]::Zero, 0, 1, [ref]$list, [ref]$count)) {
          throw "WTSEnumerateSessions failed with Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
        }
        $sessions = @()
        try {
          $size = [Runtime.InteropServices.Marshal]::SizeOf([type]'WinMgmtWtsLogoffEntry')
          for ($i = 0; $i -lt $count; $i++) {
            $entry = [Runtime.InteropServices.Marshal]::PtrToStructure([IntPtr]($list.ToInt64() + $i * $size), [type]'WinMgmtWtsLogoffEntry')
            if ($entry.SessionId -le 0) { continue }
            $user = Get-WtsText $entry.SessionId $WTSUserName
            if (-not $user) { continue }
            $domain = Get-WtsText $entry.SessionId $WTSDomainName
            $full = if ($domain) { "$domain\$user" } else { $user }
            if ($full -match '^NT (AUTHORITY|SERVICE)\\') { continue }
            $sessions += [pscustomobject]@{ SessionId = $entry.SessionId; UserName = $full; State = $stateNames[$entry.State] }
          }
        }
        finally {
          [WinMgmtWtsLogoff]::WTSFreeMemory($list)
        }
        return $sessions
      }

      try {
        $targets = @(Get-UserSessions)
        if ($targets.Count -eq 0) {
          $Ansible.Result = @{
            SessionsTargeted  = @()
            SessionsLoggedOff = 0
            Message           = 'No user sessions found.'
          }
          return
        }

        $errors = @()
        $loggedOff = 0
        foreach ($target in $targets) {
          if ([WinMgmtWtsLogoff]::WTSLogoffSession([IntPtr]::Zero, $target.SessionId, $false)) {
            $loggedOff++
          } else {
            $errors += "logoff session $($target.SessionId) failed: Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
        }
        $Ansible.Changed = $loggedOff -gt 0

        # WTSLogoffSession only asks: the sessions end once their processes do
        $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
        $left = @(Get-UserSessions)
        while ($left.Count -gt 0 -and (Get-Date) -lt $deadline) {
          Start-Sleep -Seconds 5
          $left = @(Get-UserSessions)
        }

        $Ansible.Failed = $left.Count -gt 0
        $Ansible.Result = @{
          SessionsTargeted  = @($targets | ForEach-Object { "$($_.SessionId) $($_.UserName) ($($_.State))" })
          SessionsLoggedOff = $loggedOff
          SessionsLeft      = @($left | ForEach-Object { "$($_.SessionId) $($_.UserName) ($($_.State))" })
          Errors            = @($errors)
          Message           = if ($left.Count -gt 0) { "Timeout after $TimeoutSeconds s waiting for the user sessions to end." } else { '' }
        }
      } catch {
        $Ansible.Failed = $true
        $Ansible.Result = @{
          Error = "$($_.Exception.Message)"
        }
      }
