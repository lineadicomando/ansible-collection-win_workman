---
# The `shortcuts` action applies the schema shortcuts on their own, without
# running the install workflow: it restores Desktop and Start Menu entries on
# an already installed package. Removal stays with the `off` action, which
# includes the same tasks with state absent.
- name: Shortcuts
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: shortcuts
  vars:
    win_workman_schema_shortcuts_state: "present"
