---
# <schema>-usr-off[-<targets>]: mark the targets absent, or every target of the
# policy when none is given. Each one uninstalls at next logon, or right away
# with <schema>-usr-apply. The installer is not needed to uninstall, so nothing
# is downloaded or staged beyond the agent itself.
- name: Stage usr infrastructure
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pkg_usr_stage

- name: Mark usr targets absent
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pkg_usr_policy
  vars:
    win_workman_usr_policy_state: absent
    win_workman_usr_policy_names: "{{ win_workman_usr_inline_targets }}"
    win_workman_usr_policy_all: "{{ not (win_workman_usr_inline | bool) }}"

- name: Per-user uninstall policy
  ansible.builtin.debug:
    msg:
      name: "{{ win_workman_schema.name }}"
      policy: "{{ win_workman_usr_policy_result.result.file }}"
      targets: "{{ win_workman_usr_policy_result.result.policy.targets }}"
      note: Targets uninstall at their next logon; run {{ win_workman_usr_schema }}-usr-apply for users already logged on.
