---
# Waits, up to win_workman_installer_wait_timeout seconds, until no MSI
# transaction holds the Global\_MSIExecute mutex: right after Windows Update,
# whether driven by wu or by Windows itself, an MSI can otherwise fail with
# 1618 (another install in progress). On timeout it warns and lets the install
# go on: the install task retries on 1601 and 1618 anyway.
#
# Component servicing (TiWorker) is not waited for. It does not hold the
# Windows Installer mutex, so an MSI installs fine while it runs, and it runs
# for a long time after every boot and while a cumulative installs, even with
# Windows Update paused: waiting for it held installs for the whole timeout.
- name: Wait for Windows Installer to be idle
  ansible.windows.win_powershell:
    script: |
      param([int]$Timeout)

      function Test-MsiBusy {
        $mutex = $null
        try {
          if ([System.Threading.Mutex]::TryOpenExisting('Global\_MSIExecute', [ref]$mutex)) {
            $mutex.Dispose()
            return $true
          }
          return $false
        } catch [System.UnauthorizedAccessException] {
          return $true
        }
      }

      $start = Get-Date
      $busy = $false
      do {
        $busy = Test-MsiBusy
        if (-not $busy) { break }
        Start-Sleep -Seconds 5
      } while (((Get-Date) - $start).TotalSeconds -lt $Timeout)

      $Ansible.Result = @{
        waited  = [int]((Get-Date) - $start).TotalSeconds
        timeout = $busy
      }
      $Ansible.Changed = $false
    parameters:
      Timeout: "{{ win_workman_installer_wait_timeout | default(120) | int }}"
  register: win_workman_installer_wait

- name: Warn when Windows Installer is still busy
  ansible.builtin.debug:
    msg: >-
      Windows Installer still busy after {{ win_workman_installer_wait.result.waited }}s:
      installing anyway, retrying on 1601/1618
  when: win_workman_installer_wait.result.timeout | bool
