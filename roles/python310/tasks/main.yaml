---
- name: "Warn that Python 3.10 no longer ships Windows installers"
  ansible.builtin.debug:
    msg: >-
      WARNING: Python 3.10 is in security-fix-only mode. The last Windows
      installer published by python.org is 3.10.11; later 3.10 releases are
      source-only, so this role cannot be updated any further and the binaries
      it deploys will not receive security fixes. Python 3.10 reaches
      end-of-life on 2026-10-31. That date is imminent.
      Plan a migration to the python313 or python314 role.

- name: Dispatch to package workflow
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pkg_workflow
  vars:
    win_workman_schema: "{{ win_workman_python310_schema }}"
