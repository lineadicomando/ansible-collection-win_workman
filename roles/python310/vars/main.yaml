# ==============================================================================
#  Software Information:
#      - Name:        Python 3.10
#      - Homepage:    https://www.python.org/
#      - Download:    https://www.python.org/downloads/windows/
# ==============================================================================
---
win_workman_python310_schema:
  name: Python 3.10
  role: lineadicomando.win_workman.python310
  default_action: !!str on
  package:
    setup_file: python-3.10.11-amd64.exe
    version: "3.10.11150.0"
    # The python.org installer is a WiX Burn bundle: its MSIs are installed
    # machine-wide, but the bundle entry "Python 3.10.x (64-bit)" lands only in
    # HKCU of the account that ran it, even with InstallAllUsers=1. Detect the
    # Core Interpreter MSI instead, which every account sees; off uninstalls it
    # and bundle_parts removes the other MSIs and the bundle registration.
    searchName: "Python 3.10.* Core Interpreter (64-bit)"
    bundle_parts: "Python 3.10.* (64-bit)"
    # The other MSIs find their directory through python.exe: remove them first.
    bundle_parts_last: "Python 3.10.* Executables (64-bit)"
    # Written by the bundle itself, not by its MSIs.
    bundle_cleanup_keys:
      - 'HKLM:\SOFTWARE\Python\PythonCore\3.10\InstalledFeatures'
    # Package Cache copies of 3.10 MSIs replaced by an upgrade.
    bundle_cache_version_like: "3.10.*"
    install_args: /quiet InstallAllUsers=1 PrependPath=1 Include_launcher=0
    uninstall_args: /qn /norestart
    cleanup_paths:
      - '%ProgramFiles%\Python310'
      - '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Python 3.10'
      - '%Public%\Desktop\Python 3.10 (64-bit).lnk'
      - '%Public%\Desktop\IDLE (Python 3.10 64-bit).lnk'
  files:
    - filename: python-3.10.11-amd64.exe
      url: https://www.python.org/ftp/python/3.10.11/python-3.10.11-amd64.exe
      checksum: sha256:d8dede5005564b408ba50317108b765ed9c3c510342a598f9fd42681cbe0648b
  shortcuts:
    - description: "Launches the Python 3.10 interpreter"
      src: '%ProgramFiles%\Python310\python.exe'
      dest: '%Public%\Desktop\Python 3.10 (64-bit).lnk'
      icon: '%ProgramFiles%\Python310\python.exe,0'
      directory: '%ProgramFiles%\Python310'
    - description: "Launches IDLE, the interactive environment for Python 3.10"
      src: '%ProgramFiles%\Python310\pythonw.exe'
      arguments: '"%ProgramFiles%\Python310\Lib\idlelib\idle.pyw"'
      dest: '%Public%\Desktop\IDLE (Python 3.10 64-bit).lnk'
      icon: '%SystemRoot%\Installer\{6108D417-E511-4AFC-A24D-7CEE1DC9D3EE}\idle.exe,0'
      directory: '%ProgramFiles%\Python310'
