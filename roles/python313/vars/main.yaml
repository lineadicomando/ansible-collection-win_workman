# ==============================================================================
#  Software Information:
#      - Name:        Python 3.13
#      - Homepage:    https://www.python.org/
#      - Download:    https://www.python.org/downloads/windows/
# ==============================================================================
---
win_workman_python313_schema:
  name: Python 3.13
  role: lineadicomando.win_workman.python313
  default_action: !!str on
  package:
    setup_file: python-3.13.15-amd64.exe
    version: "3.13.15150.0"
    provider: registry
    searchName: "Python 3.13.15 (64-bit)"
    install_args: /quiet InstallAllUsers=1 PrependPath=1 Include_launcher=0
    uninstall_args: /quiet
    cleanup_paths:
      - '%ProgramFiles%\Python313'
      - '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Python 3.13'
      - '%Public%\Desktop\Python 3.13 (64-bit).lnk'
      - '%Public%\Desktop\IDLE (Python 3.13 64-bit).lnk'
  files:
    - filename: python-3.13.15-amd64.exe
      url: https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe
      checksum: sha256:edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403
  shortcuts:
    - description: "Launches the Python 3.13 interpreter"
      src: '%ProgramFiles%\Python313\python.exe'
      dest: '%Public%\Desktop\Python 3.13 (64-bit).lnk'
      icon: '%ProgramFiles%\Python313\python.exe,0'
      directory: '%ProgramFiles%\Python313'
    - description: "Launches IDLE, the interactive environment for Python 3.13"
      src: '%ProgramFiles%\Python313\pythonw.exe'
      arguments: '"%ProgramFiles%\Python313\Lib\idlelib\idle.pyw"'
      dest: '%Public%\Desktop\IDLE (Python 3.13 64-bit).lnk'
      icon: '%SystemRoot%\Installer\{DFDDB8BD-7449-4F42-971B-30AEC110337C}\idle.exe,0'
      directory: '%ProgramFiles%\Python313'
