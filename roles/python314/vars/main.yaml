# ==============================================================================
#  Software Information:
#      - Name:        Python 3.14
#      - Homepage:    https://www.python.org/
#      - Download:    https://www.python.org/downloads/windows/
# ==============================================================================
---
win_workman_python314_schema:
  name: Python 3.14
  role: lineadicomando.win_workman.python314
  default_action: !!str on
  package:
    setup_file: python-3.14.10-amd64.exe
    version: "3.14.10150.0"
    # The python.org installer is a WiX Burn bundle: its MSIs are installed
    # machine-wide, but the bundle entry "Python 3.14.x (64-bit)" lands only in
    # HKCU of the account that ran it, even with InstallAllUsers=1. Detect the
    # Core Interpreter MSI instead, which every account sees; off uninstalls it
    # and bundle_parts removes the other MSIs and the bundle registration.
    searchName: "Python 3.14.* Core Interpreter (64-bit)"
    bundle_parts: "Python 3.14.* (64-bit)"
    # The other MSIs find their directory through python.exe: remove them first.
    bundle_parts_last: "Python 3.14.* Executables (64-bit)"
    # Written by the bundle itself, not by its MSIs.
    bundle_cleanup_keys:
      - 'HKLM:\SOFTWARE\Python\PythonCore\3.14\InstalledFeatures'
    # Package Cache copies of 3.14 MSIs replaced by an upgrade.
    bundle_cache_version_like: "3.14.*"
    install_args: /quiet InstallAllUsers=1 PrependPath=1 Include_launcher=0 Shortcuts=1
    uninstall_args: /qn /norestart
    cleanup_paths:
      - '%ProgramFiles%\Python314'
      - '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Python 3.14'
      - '%Public%\Desktop\Python 3.14 (64-bit).lnk'
      - '%Public%\Desktop\IDLE (Python 3.14 64-bit).lnk'
  files:
    - filename: python-3.14.10-amd64.exe
      url: https://www.python.org/ftp/python/3.14.10/python-3.14.10-amd64.exe
      checksum: sha256:92480239264744fe0386a1bd8275786fefa126e3129e56a68e22b52c73329965
  shortcuts:
    - description: "Launches the Python 3.14 interpreter"
      src: '%ProgramFiles%\Python314\python.exe'
      dest: '%Public%\Desktop\Python 3.14 (64-bit).lnk'
      icon: '%ProgramFiles%\Python314\python.exe,0'
      directory: '%ProgramFiles%\Python314'
    - description: "Launches IDLE, the interactive environment for Python 3.14"
      src: '%ProgramFiles%\Python314\pythonw.exe'
      arguments: '"%ProgramFiles%\Python314\Lib\idlelib\idle.pyw"'
      dest: '%Public%\Desktop\IDLE (Python 3.14 64-bit).lnk'
      icon: '%SystemRoot%\Installer\{66674362-34AE-4C92-854B-AEF1C07E3F15}\idle.exe,0'
      directory: '%ProgramFiles%\Python314'
