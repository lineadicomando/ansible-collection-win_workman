---
display_name: System File Checker (sfc)
custom_actions:
  - name: "on"
    description: Run sfc /scannow to scan and repair protected system files
defaults:
  - var: win_workman_restart
    type: bool
    default: true
    description: Restart the host first when Windows has a reboot pending, whoever is logged on; false skips the check
notes: "Does not install software. Consider running 'wim-repair' first for severe corruption. Fails when sfc cannot repair a file and when it did not scan at all, e.g. with a repair pending that needs a restart."
