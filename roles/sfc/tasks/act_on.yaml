---
- name: Check for pending reboot
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pending_restart
  when:
    - win_workman_restart | default(true) | bool

- name: Run sfc /scannow
  ansible.windows.win_powershell:
    script: |
      $logFile = Join-Path $env:windir 'Logs\sfc_log_file.log'
      $cbsDir  = Join-Path $env:windir 'Logs\CBS'

      $Ansible.Changed = $false
      $Ansible.Failed  = $false
      $Ansible.Result  = @{}

      Remove-Item -Path $logFile -ErrorAction SilentlyContinue

      try {
        $startTime = Get-Date
        $started   = $startTime.ToString('yyyy-MM-dd HH:mm:ss')

        $psi = New-Object System.Diagnostics.ProcessStartInfo
        $psi.FileName               = 'sfc.exe'
        $psi.Arguments              = '/scannow'
        $psi.RedirectStandardOutput = $true
        $psi.RedirectStandardError  = $true
        $psi.UseShellExecute        = $false
        $psi.CreateNoWindow         = $true
        $psi.StandardOutputEncoding = [System.Text.Encoding]::Unicode
        $psi.StandardErrorEncoding  = [System.Text.Encoding]::Unicode

        $process = New-Object System.Diagnostics.Process
        $process.StartInfo = $psi

        [void]$process.Start()

        $stdOut   = $process.StandardOutput.ReadToEnd()
        $stdErr   = $process.StandardError.ReadToEnd()
        $process.WaitForExit()
        $exitCode = $process.ExitCode

        Start-Sleep -Seconds 2

        # sfc logs every step to CBS.log as [SR]: the lines of this run are
        # those stamped from its start on. A long scan can roll CBS.log over
        # into a CbsPersist file meanwhile, so those written since are read too.
        $logs = @(Get-ChildItem -Path $cbsDir -Filter 'CbsPersist_*.log' -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -ge $startTime } |
            Sort-Object LastWriteTime |
            ForEach-Object { $_.FullName }) +
          @(Join-Path $cbsDir 'CBS.log') |
          Where-Object { Test-Path -LiteralPath $_ }

        $sr = @()
        if ($logs) {
          $sr = @(Select-String -LiteralPath $logs -SimpleMatch '[SR]' -ErrorAction SilentlyContinue |
            Where-Object { $_.Line.Substring(0, [math]::Min(19, $_.Line.Length)) -ge $started } |
            ForEach-Object { $_.Line })
        }
        $sr | Out-File -FilePath $logFile -Encoding UTF8

        # None of them means sfc never scanned
        $scanRan      = $sr.Count -gt 0
        $repaired     = @($sr -match 'Repaired file|Repairing corrupted file').Count
        $cannotRepair = @($sr -match 'Cannot repair').Count
        $repairFailed = @($sr -match 'Repair failed').Count

        $Ansible.Changed = $repaired -gt 0
        $Ansible.Failed  = ($cannotRepair -gt 0) -or ($repairFailed -gt 0) -or -not $scanRan

        $lines = ($stdOut -replace "`0","") -split "(`r`n|`n)" |
          ForEach-Object { $_.Trim() } |
          Where-Object { $_ -and ($_ -notmatch '\d') }

        $cleanStdOut = ($lines -join ' - ') -replace '\s{2,}', ' '

        if (-not $scanRan) {
          $message = "sfc did not scan (exit code $exitCode): no [SR] entry was written to CBS.log."
        } elseif ($Ansible.Failed) {
          $message = "sfc could not repair everything: $cannotRepair 'Cannot repair', $repairFailed 'Repair failed', $repaired repair entries. See $logFile on the host."
        } elseif ($repaired -gt 0) {
          $message = "sfc repaired system files: $repaired repair entries. See $logFile on the host."
        } else {
          $message = 'sfc found no integrity violation.'
        }

        $Ansible.Result = @{
          ExitCode      = $exitCode
          Message       = $message
          StdOut        = $cleanStdOut
          StdErr        = $stdErr
          LogFile       = $logFile
          ScanRan       = $scanRan
          Repaired      = $repaired -gt 0
          CannotRepair  = $cannotRepair -gt 0
          RepairFailed  = $repairFailed -gt 0
        }
      }
      catch {
        $Ansible.Failed = $true
        $Ansible.Result = @{
          Error        = "$($_.Exception.Message)"
          ExitCode     = -1
          StdOut       = ''
          StdErr       = ''
        }
      }
  register: win_workman_sfc

- name: Show sfc result
  ansible.builtin.debug:
    msg: "{{ win_workman_sfc.result.Message | default('no result') }}"
