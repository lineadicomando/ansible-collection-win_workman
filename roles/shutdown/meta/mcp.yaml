---
display_name: System Shutdown
custom_actions:
  - name: "on"
    description: >-
      Shut down the host (delay: win_workman_shutdown_timeout seconds, default
      30) and wait until it goes offline, failing if it does not; set
      win_workman_shutdown_wait=false to return as soon as the command is sent
  - name: no_wait
    description: >-
      Shut down the host as 'on' but return as soon as the command is sent,
      even with win_workman_shutdown_wait=true
  - name: abort
    description: Abort a pending shutdown previously scheduled with 'on'
  - name: a
    description: Alias for 'abort'
  - name: wait
    description: Shut down the host and wait until it goes offline, even with win_workman_shutdown_wait=false
  - name: if
    description: >-
      Shut down only if the condition holds; the condition is required, and the
      only one supported is nouser: shutdown-if-nouser shuts down when no user
      session is open in any state (a locked or disconnected session keeps the
      host on) and otherwise reports who is logged on. Waits for the shutdown
      as 'on' does. A bare shutdown-if fails validation
notes: >-
  Does not install software. Override the delay with -e
  win_workman_shutdown_timeout=<seconds>. The wait watches the connection port
  from the controller; win_workman_shutdown_wait_timeout (default 900) is the
  margin after the delay, sized for hosts installing updates at shutdown.
