---
win_workman_shutdown_schema:
  name: Shutdown
  role: lineadicomando.win_workman.shutdown
  default_action: !!str on

# Port the controller watches: the one of the Ansible connection
_win_workman_shutdown_port: >-
  {{ ansible_port | default(
       22 if ansible_connection | default('ssh') == 'ssh'
       else (5986 if ansible_winrm_scheme | default('http') == 'https' else 5985)
     ) }}
