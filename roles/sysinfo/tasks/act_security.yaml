---
- name: Collect security information
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.sysinfo
    tasks_from: collect
  vars:
    win_workman_sysinfo_sections:
      - security

- name: Report security information
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.sysinfo
    tasks_from: report
