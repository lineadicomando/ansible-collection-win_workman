---
- name: Resolve requested sections
  ansible.builtin.set_fact:
    win_workman_sysinfo_requested_sections: >-
      {{
        (win_workman_task.argv[2:] | map('lower') | list)
        if (
          win_workman_task is defined
          and (win_workman_task.argv | default([]) | length) > 2
        )
        else (win_workman_sysinfo_sections | map('lower') | list)
      }}

- name: Validate requested sections
  ansible.builtin.assert:
    that:
      - win_workman_sysinfo_requested_sections | length > 0
      - >-
        win_workman_sysinfo_requested_sections
        | difference(win_workman_sysinfo_known_sections) | length == 0
    fail_msg: >-
      Unknown sysinfo section(s):
      {{ win_workman_sysinfo_requested_sections | difference(win_workman_sysinfo_known_sections) | join(', ') }}.
      Available: {{ win_workman_sysinfo_known_sections | join(', ') }}
    quiet: true

- name: Collect system information
  ansible.windows.win_powershell:
    parameters:
      SectionsJson: "{{ win_workman_sysinfo_requested_sections | to_json }}"
    script: |
      param(
        [string]$SectionsJson
      )

      # Sections are collected with plain if/try blocks rather than helper
      # functions: under win_powershell a function's $script: scope is not the
      # scope holding $result, so a function-based collector silently yields {}.
      $ErrorActionPreference = "Stop"
      $Ansible.Changed = $false
      $Ansible.Failed = $false

      # Windows PowerShell 5.1 does not enumerate the array returned by
      # ConvertFrom-Json: @(...) would yield a single Object[] element and every
      # -contains test would fail. The [string[]] cast flattens it properly.
      $sections = [string[]]@()
      if (-not [string]::IsNullOrWhiteSpace($SectionsJson)) {
        $sections = [string[]](ConvertFrom-Json -InputObject $SectionsJson)
      }

      $result = [ordered]@{}

      # Shared CIM instances, fetched once and only when a section needs them.
      $cimOs = $null
      $cimCs = $null
      if ($sections -contains "os") {
        $cimOs = Get-CimInstance Win32_OperatingSystem
      }
      if (($sections -contains "identity") -or ($sections -contains "hw")) {
        $cimCs = Get-CimInstance Win32_ComputerSystem
      }

      if ($sections -contains "os") {
        try {
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $displayVersion = $cv.DisplayVersion
          if ([string]::IsNullOrWhiteSpace($displayVersion)) { $displayVersion = $cv.ReleaseId }
          if ([string]::IsNullOrWhiteSpace($displayVersion)) { $displayVersion = "unknown" }

          $ubr = 0
          if ($null -ne $cv.UBR) { $ubr = [int]$cv.UBR }
          $currentBuild = [int]$cv.CurrentBuild

          # CurrentVersion\ProductName still reports "Windows 10 Pro" on Windows 11:
          # Win32_OperatingSystem.Caption is the reliable name, and the build number
          # is the authoritative discriminator (>= 22000 means Windows 11).
          $major = 10
          if ($currentBuild -ge 22000) { $major = 11 }

          # Lab machines are usually up for hours, not days: a days-only figure
          # would round to 0 for a whole morning of lessons.
          $uptime = (Get-Date) - $cimOs.LastBootUpTime
          # TimeSpan components, not [int] casts: PowerShell rounds rather than
          # truncates, so [int]0.7 would report 44 minutes of uptime as "1h".
          if ($uptime.TotalDays -ge 1) {
            $uptimeText = "{0}d {1}h" -f $uptime.Days, $uptime.Hours
          } else {
            $uptimeText = "{0}h {1}m" -f $uptime.Hours, $uptime.Minutes
          }

          $result["os"] = [ordered]@{
            caption         = ([string]$cimOs.Caption).Trim()
            major           = $major
            display_version = [string]$displayVersion
            build           = "$currentBuild.$ubr"
            build_number    = $currentBuild
            ubr             = $ubr
            architecture    = [string]$cimOs.OSArchitecture
            install_date    = $cimOs.InstallDate.ToString("yyyy-MM-dd")
            last_boot       = $cimOs.LastBootUpTime.ToString("yyyy-MM-dd HH:mm")
            uptime          = $uptimeText
            uptime_days     = [math]::Round($uptime.TotalDays, 1)
            uptime_hours    = [math]::Round($uptime.TotalHours, 1)
            locale          = (Get-Culture).Name
          }
        } catch {
          $result["os"] = [ordered]@{ error = $_.Exception.Message }
        }
      }

      if ($sections -contains "identity") {
        try {
          $loggedOn = ""
          if ($cimCs.UserName) { $loggedOn = [string]$cimCs.UserName }

          $result["identity"] = [ordered]@{
            hostname       = [string]$env:COMPUTERNAME
            part_of_domain = [bool]$cimCs.PartOfDomain
            domain         = [string]$cimCs.Domain
            workgroup      = [string]$cimCs.Workgroup
            logged_on_user = $loggedOn
          }
        } catch {
          $result["identity"] = [ordered]@{ error = $_.Exception.Message }
        }
      }

      if ($sections -contains "hw") {
        try {
          $bios = Get-CimInstance Win32_BIOS
          $cpu = @(Get-CimInstance Win32_Processor)[0]

          $result["hw"] = [ordered]@{
            manufacturer = ([string]$cimCs.Manufacturer).Trim()
            model        = ([string]$cimCs.Model).Trim()
            serial       = ([string]$bios.SerialNumber).Trim()
            bios_version = [string]$bios.SMBIOSBIOSVersion
            cpu          = ([string]$cpu.Name).Trim()
            cpu_cores    = [int]$cpu.NumberOfCores
            cpu_threads  = [int]$cpu.NumberOfLogicalProcessors
            ram_gb       = [math]::Round($cimCs.TotalPhysicalMemory / 1GB, 1)
          }
        } catch {
          $result["hw"] = [ordered]@{ error = $_.Exception.Message }
        }
      }

      if ($sections -contains "disk") {
        try {
          # DriveType 3 = local fixed disk; network and removable drives are noise here.
          $disks = @()
          foreach ($vol in @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3")) {
            $size = [double]$vol.Size
            $free = [double]$vol.FreeSpace
            $freePct = 0
            if ($size -gt 0) { $freePct = [math]::Round(($free / $size) * 100, 1) }

            $disks += [ordered]@{
              device   = [string]$vol.DeviceID
              label    = [string]$vol.VolumeName
              size_gb  = [math]::Round($size / 1GB, 1)
              free_gb  = [math]::Round($free / 1GB, 1)
              free_pct = $freePct
            }
          }
          $result["disk"] = $disks
        } catch {
          $result["disk"] = @([ordered]@{ error = $_.Exception.Message })
        }
      }

      if ($sections -contains "net") {
        try {
          $adapters = @()
          foreach ($nic in @(Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "IPEnabled=True")) {
            $ipv4 = @($nic.IPAddress | Where-Object { $_ -notmatch ":" })
            $ip = ""
            if ($ipv4.Count -gt 0) { $ip = [string]$ipv4[0] }
            $gateway = ""
            if ($nic.DefaultIPGateway) { $gateway = [string]@($nic.DefaultIPGateway)[0] }

            $adapters += [ordered]@{
              description = [string]$nic.Description
              mac         = [string]$nic.MACAddress
              ip          = $ip
              gateway     = $gateway
              dhcp        = [bool]$nic.DHCPEnabled
            }
          }
          $result["net"] = $adapters
        } catch {
          $result["net"] = @([ordered]@{ error = $_.Exception.Message })
        }
      }

      if ($sections -contains "security") {
        try {
          # Get-Tpm is the only source for RestartPending, which tells whether a
          # TPM just enabled in firmware still needs a reboot to finish
          # provisioning. Win32_Tpm is faster but does not expose it.
          $tpm = Get-Tpm -ErrorAction SilentlyContinue
          $spec = "none"
          $cimTpm = Get-CimInstance -Namespace "root/cimv2/security/microsofttpm" -ClassName Win32_Tpm -ErrorAction SilentlyContinue
          if ($cimTpm) { $spec = (([string]$cimTpm.SpecVersion) -split ",")[0].Trim() }

          # ManufacturerVersion comes back padded with NUL characters.
          $firmware = ""
          if ($tpm) { $firmware = ([string]$tpm.ManufacturerVersion).Trim([char]0).Trim() }

          $device = "absent"
          $firstInstall = ""
          $pnp = @(Get-PnpDevice -Class SecurityDevices -ErrorAction SilentlyContinue)[0]
          if ($pnp) {
            $device = "{0}={1}" -f $pnp.InstanceId, $pnp.Status
            # Dates the appearance of the device, and with it the BIOS change
            # that enabled the TPM: the only evidence left once it is running.
            $first = (Get-PnpDeviceProperty -InstanceId $pnp.InstanceId -KeyName "DEVPKEY_Device_FirstInstallDate" -ErrorAction SilentlyContinue).Data
            if ($first) { $firstInstall = $first.ToString("yyyy-MM-dd HH:mm") }
          }

          # Confirm-SecureBootUEFI throws "not supported on this platform" when
          # the machine booted in legacy mode, so the failure itself is the
          # firmware check: Windows 11 needs a Secure Boot capable machine, not
          # Secure Boot switched on.
          $secureBoot = "unavailable"
          $firmwareType = "Legacy BIOS"
          try {
            $secureBoot = if (Confirm-SecureBootUEFI -ErrorAction Stop) { "enabled" } else { "disabled" }
            $firmwareType = "UEFI"
          } catch {
            $secureBoot = "unavailable"
          }

          $partitionStyle = "unknown"
          $sysDisk = Get-Partition -DriveLetter C -ErrorAction SilentlyContinue | Get-Disk -ErrorAction SilentlyContinue
          if ($sysDisk) { $partitionStyle = [string]$sysDisk.PartitionStyle }

          $result["security"] = [ordered]@{
            tpm_present         = [bool]($tpm -and $tpm.TpmPresent)
            tpm_ready           = [bool]($tpm -and $tpm.TpmReady)
            tpm_enabled         = [bool]($tpm -and $tpm.TpmEnabled)
            tpm_activated       = [bool]($tpm -and $tpm.TpmActivated)
            tpm_owned           = [bool]($tpm -and $tpm.TpmOwned)
            tpm_restart_pending = [bool]($tpm -and $tpm.RestartPending)
            tpm_spec            = $spec
            tpm_manufacturer    = if ($tpm) { ([string]$tpm.ManufacturerIdTxt).Trim() } else { "" }
            tpm_firmware        = $firmware
            tpm_device          = $device
            tpm_first_install   = $firstInstall
            secure_boot         = $secureBoot
            firmware            = $firmwareType
            partition_style     = $partitionStyle
          }
        } catch {
          $result["security"] = [ordered]@{ error = $_.Exception.Message }
        }
      }

      if ($sections -contains "wu") {
        try {
          $wuPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate"
          $pol = Get-ItemProperty -Path $wuPolicy -ErrorAction SilentlyContinue
          $au = Get-ItemProperty -Path "$wuPolicy\AU" -ErrorAction SilentlyContinue

          $targetRelease = ""
          if ($pol -and $pol.TargetReleaseVersionInfo) { $targetRelease = [string]$pol.TargetReleaseVersionInfo }

          $paused = ""
          $ux = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings" -ErrorAction SilentlyContinue
          if ($ux -and $ux.PauseFeatureUpdatesEndTime) { $paused = [string]$ux.PauseFeatureUpdatesEndTime }

          # UpgEx/RedReason record why a given feature update is not offered.
          # They are written by the Microsoft Compatibility Appraiser scheduled
          # task and NOT recomputed on read: after a firmware change they keep
          # reporting the old reason until the appraiser runs again.
          #
          # Keyed by target release with a flat string value on purpose: the
          # win_powershell serializer only goes a couple of levels deep, and a
          # list of hashtables this far down the result comes back as literal
          # "System.Collections.Specialized.OrderedDictionary" strings.
          $blocks = [ordered]@{}
          $indicators = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TargetVersionUpgradeExperienceIndicators"
          foreach ($key in @(Get-ChildItem $indicators -ErrorAction SilentlyContinue | Sort-Object PSChildName)) {
            $props = Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue
            if ($props -and $props.UpgEx) {
              $reason = [string]$props.RedReason
              if ([string]::IsNullOrWhiteSpace($reason) -or $reason -eq "None") {
                $blocks[[string]$key.PSChildName] = [string]$props.UpgEx
              } else {
                $blocks[[string]$key.PSChildName] = "{0}: {1}" -f [string]$props.UpgEx, $reason
              }
            }
          }

          # Setup writes a compatibility report on every upgrade attempt; the
          # hard blocks in it are the authoritative list of what stopped it.
          $compatName = ""
          $compatDate = ""
          $hardBlocks = [string[]]@()
          $report = Get-ChildItem -Path "C:\`$WINDOWS.~BT\Sources\Panther" -Filter "CompatData_*.xml" -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($report) {
            $compatName = [string]$report.Name
            $compatDate = $report.LastWriteTime.ToString("yyyy-MM-dd")
            try {
              [xml]$doc = Get-Content -LiteralPath $report.FullName -Raw
              $found = @()
              foreach ($item in $doc.SelectNodes('//*[local-name()="HardwareItem"]')) {
                foreach ($child in $item.ChildNodes) {
                  if ([string]$child.BlockingType -eq "Hard") { $found += [string]$item.HardwareType }
                }
              }
              # The [string[]] cast keeps a single block an array rather than a
              # bare string, which would iterate per character on the Jinja side.
              $hardBlocks = [string[]]@($found | Select-Object -Unique)
            } catch {
              $hardBlocks = [string[]]@("parse error")
            }
          }

          $result["wu"] = [ordered]@{
            target_release     = $targetRelease
            target_release_set = [bool]($pol -and $pol.TargetReleaseVersion)
            no_auto_update     = [bool]($au -and $au.NoAutoUpdate)
            use_wu_server      = [bool]($au -and $au.UseWUServer)
            wsus_server        = if ($pol -and $pol.WUServer) { [string]$pol.WUServer } else { "" }
            defer_feature_days = if ($pol -and $null -ne $pol.DeferFeatureUpdatesPeriodInDays) { [int]$pol.DeferFeatureUpdatesPeriodInDays } else { 0 }
            branch_readiness   = if ($pol -and $null -ne $pol.BranchReadinessLevel) { [int]$pol.BranchReadinessLevel } else { 0 }
            feature_paused_until = $paused
            upgrade_blocks     = $blocks
            compat_report      = $compatName
            compat_report_date = $compatDate
            compat_hard_blocks = $hardBlocks
            # Pre-joined form: Jinja cannot hash a list, so the lab-wide
            # aggregation in report.yaml groups hosts on this string instead.
            compat_hard_blocks_text = ($hardBlocks -join ", ")
          }
        } catch {
          $result["wu"] = [ordered]@{ error = $_.Exception.Message }
        }
      }

      $Ansible.Result = $result
  register: win_workman_sysinfo_raw
  changed_when: false

- name: Set sysinfo fact
  ansible.builtin.set_fact:
    win_workman_sysinfo: "{{ win_workman_sysinfo_raw.result }}"
