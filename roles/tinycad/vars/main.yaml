# ==============================================================================
#  Software Information:
#      - Name:        TinyCAD
#      - Homepage:    https://www.tinycad.net/
#      - Download:    https://github.com/matt123p/TinyCADv4/releases
# ==============================================================================
---
win_workman_tinycad_schema:
  name: TinyCAD
  role: lineadicomando.win_workman.tinycad
  default_action: !!str on
  package:
    provider: portable
    portable_dir: TinyCAD
  files:
    # The x64-only installer: the plain one is universal and carries both
    # app-64.7z and app-arm64.7z, which extract over each other.
    - filename: TinyCAD.Windows.Setup.4.1.2-x64.exe
      url: https://github.com/matt123p/TinyCADv4/releases/download/v4.1.2/TinyCAD.Windows.Setup.4.1.2-x64.exe
      checksum: sha256:6572aacebe1eec70345fbc3db77486271f9f790c121c0cfdcb59368354f6bed9
      extract: 7z
      dest_dir: TinyCAD
  shortcuts:
    - description: "TinyCAD"
      src: "{{ win_workman_portable_path }}\\TinyCAD\\TinyCAD.exe"
      dest: '%Public%\Desktop\TinyCAD.lnk'
      icon: "{{ win_workman_portable_path }}\\TinyCAD\\TinyCAD.exe,0"
      directory: "{{ win_workman_portable_path }}\\TinyCAD\\"
