---
# on/off log off and collect the profiles once, then include the single actions
# with win_workman_wallpaper_profiles_ready: an include var, scoped to the include,
# unlike the fact, which would outlive the action and go stale after a restart.
- name: Logoff interactive sessions
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: logoff
  when: not (win_workman_wallpaper_profiles_ready | default(false) | bool)

- name: Ensure wallpaper target profiles are collected
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.wallpaper
    tasks_from: wallpaper_profiles
  when: not (win_workman_wallpaper_profiles_ready | default(false) | bool)

- name: Lock every profile on its current wallpaper
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.wallpaper
    tasks_from: lock_profiles
