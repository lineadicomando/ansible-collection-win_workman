---
win_workman_win_iso_openssh_version: 10.4.0.0p1-Preview
win_workman_win_iso_openssh_msi: OpenSSH-Win64-v10.4.0.0.msi

win_workman_win_iso_schema:
  name: Windows installation ISO
  role: lineadicomando.win_workman.win_iso
  default_action: !!str build
  # Downloaded into win_workman_storage_path by pkg_utils/download (ssh=msi).
  files:
    - filename: "{{ win_workman_win_iso_openssh_msi }}"
      url: >-
        https://github.com/PowerShell/Win32-OpenSSH/releases/download/{{ win_workman_win_iso_openssh_version }}/{{ win_workman_win_iso_openssh_msi }}
      checksum: sha256:788d8643464a01eb63640a2fd746f9ed23d106b5a901a35f88dc8cd40e446ac9

# The OpenSSH Server package in the Languages and Optional Features ISO.
win_workman_win_iso_fod_cab: OpenSSH-Server-Package~31bf3856ad364e35~amd64~~.cab

win_workman_win_iso_ssh_mode: >-
  {{ ((win_workman_task_argv | default([]) | select('in', ['msi', 'dism', 'none']) | list)
      + [win_workman_win_iso_ssh]) | first }}

win_workman_win_iso_source_path: >-
  {{ win_workman_win_iso_source | expanduser
     if win_workman_win_iso_source is match('[/~]')
     else win_workman_win_iso_root ~ '/' ~ win_workman_win_iso_source }}
win_workman_win_iso_output_path: >-
  {{ (win_workman_win_iso_output | expanduser
      if win_workman_win_iso_output is match('[/~]')
      else win_workman_win_iso_root ~ '/' ~ win_workman_win_iso_output)
     if win_workman_win_iso_output | length > 0
     else win_workman_win_iso_source_path | regex_replace('(?i)\.iso$', '') ~ '-unattended.iso' }}
win_workman_win_iso_fod_path: >-
  {{ win_workman_win_iso_fod_source | expanduser
     if win_workman_win_iso_fod_source is match('[/~]')
     else win_workman_win_iso_root ~ '/' ~ win_workman_win_iso_fod_source }}
