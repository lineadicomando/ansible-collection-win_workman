---
display_name: Windows Update
custom_actions:
  - name: run
    description: >-
      Install Windows updates. wu-run / wu-run-security: security, critical,
      rollups, Defender definitions. wu-run-full: all but feature updates.
      wu-run-upgrades: feature updates only. wu-run-cat-<a>+<b>: explicit
      categories (security, critical, rollups, definitions, updates, drivers,
      featurepacks, servicepacks, tools, upgrades, ...). Then reports build
      before/after and each update's outcome (fact win_workman_wu_report);
      fails if an update fails to install
  - name: "on"
    description: Resume Windows Update (alias for resume)
  - name: "off"
    description: Pause Windows Update at max duration (alias for pause at max)
  - name: pause
    description: Pause Windows Update for win_workman_wu_pause_days days
  - name: max_pause_days
    description: "Read or set FlightSettingsMaxPauseDays: without args reports current value; with a duration (e.g. max_pause_days-35 or max_pause_days-5-w) sets the cap"
  - name: resume
    description: Resume Windows Update (clear pause)
  - name: is_paused
    description: Check if Windows Update is currently paused (sets win_workman_wu_is_paused fact)
  - name: policy_standard
    description: Apply standard Windows Update policy (quality + feature updates enabled)
  - name: policy_ansible_managed
    description: Removed; fails on purpose. Use pause/off, or policy_standard to restore the default policy
defaults:
  - var: win_workman_wu_pause_days
    type: int
    default: 7
    description: Number of days to pause updates when using 'pause' action
  - var: win_workman_wu_default_max_pause_days
    type: int
    default: 35
    description: Maximum pause duration used by 'off' and as reset target for max_pause_days-0
  - var: win_workman_wu_default_profile
    type: str
    default: security
    description: Profile used by a bare wu-run
  - var: win_workman_wu_categories
    type: list
    default: []
    description: Category aliases replacing the chosen profile's categories (a wu-run-cat-... selector still wins)
  - var: win_workman_restart
    type: bool
    default: true
    description: Allow restart after update installation if required
  - var: win_workman_restart_timeout
    type: int
    default: 600
    description: Seconds to wait for the host after each reboot (shared with the pkg_utils restart)
  - var: win_workman_wu_unpause
    type: bool
    default: false
    description: Resume updates before 'run' (when updates are kept paused between runs)
