---
- name: Resolve which updates to install
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.wu
    tasks_from: run_selection

- name: Read Windows build before updating
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.wu
    tasks_from: build_info

- name: Keep the build read before updating
  ansible.builtin.set_fact:
    win_workman_wu_build_before: "{{ win_workman_wu_build }}"

- name: Windows Update Unpaused
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.wu
    tasks_from: pause_handler
  vars:
    win_workman_wu_state: "unpaused"
  when: win_workman_wu_unpause | bool

# Finishes whatever servicing was already in progress before the run (e.g.
# updates Windows staged on its own), so WUA starts from a clean state.
- name: Check for pending reboot
  ansible.builtin.include_role:
    name: lineadicomando.win_workman.pkg_utils
    tasks_from: pending_restart
  vars:
    win_workman_restart_timeout: "{{ win_workman_wu_reboot_timeout }}"
  when:
    - win_workman_restart | bool

- name: Start with no install round done
  ansible.builtin.set_fact:
    win_workman_wu_rounds: []
    win_workman_wu_reboots: 0
    win_workman_wu_done: false

# Updates install in rounds, with a pkg_utils restart between them, so updates
# unlocked by a reboot (servicing stack, then cumulative) go in the same run.
# The restart is not left to win_updates: its reboot is over as soon as the
# logon screen is up, and Windows may reboot again on its own right after, while
# win_updates is already searching, which drops the host as unreachable. The
# pkg_utils restart also waits for servicing to be idle, and rides out such a
# reboot. The report runs in "always" so that a failed install still says
# which updates went through and which did not before the host is marked failed.
- name: Install updates and report
  block:
    - name: Install updates in rounds
      ansible.builtin.include_role:
        name: lineadicomando.win_workman.wu
        tasks_from: run_round
      loop: "{{ range(1, win_workman_wu_max_rounds | int + 1) | list }}"
      loop_control:
        loop_var: win_workman_wu_round_number

  always:
    - name: Merge the install rounds
      ansible.builtin.set_fact:
        win_workman_wu_install: >-
          {%- set updates = win_workman_wu_rounds | map(attribute='updates', default={}) | combine -%}
          {%- set last = win_workman_wu_rounds | last | default({}) -%}
          {{
            {
              'found_update_count': updates | length,
              'installed_update_count': updates.values() | rejectattr('failure_hresult_code', 'defined')
                                          | selectattr('installed', 'defined') | selectattr('installed') | list | length,
              'failed_update_count': updates.values() | selectattr('failure_hresult_code', 'defined') | list | length,
              'reboot_required': (last.reboot_required | default(false) | bool) and not (win_workman_restart | bool),
              'reboots': win_workman_wu_reboots | int,
              'rounds': win_workman_wu_rounds | length,
              'rounds_exhausted': not (win_workman_wu_done | bool) and win_workman_wu_rounds | length >= win_workman_wu_max_rounds | int,
              'updates': updates,
              'filtered_updates': last.filtered_updates | default({}),
            }
          }}

    - name: Read Windows build after updating
      ansible.builtin.include_role:
        name: lineadicomando.win_workman.wu
        tasks_from: build_info

    - name: Report Windows Update result
      ansible.builtin.include_role:
        name: lineadicomando.win_workman.wu
        tasks_from: run_report

# win_updates can succeed as a task while single updates fail to install.
- name: Fail if some updates failed to install
  ansible.builtin.fail:
    msg: >-
      {{ win_workman_wu_report.failed }} update(s) failed to install:
      {{ win_workman_wu_report.updates | select('match', '\[failed') | join('; ') }}
  when: win_workman_wu_report.failed | int > 0
