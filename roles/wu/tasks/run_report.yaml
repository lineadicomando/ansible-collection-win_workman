---
# Summary of a wu-run on one host. win_updates reports "ok" both when nothing
# was found and when a previous reboot finished installing what Windows had
# staged on its own, so the recap alone cannot tell what happened: this file
# states it, from the install result and the build read before and after.
#
# Inputs: win_workman_wu_install (registered win_updates result),
# win_workman_wu_selection,
# win_workman_wu_build_before, win_workman_wu_build, win_workman_wu_pause_status,
# win_workman_wu_pause_expiry.
- name: Build Windows Update report
  ansible.builtin.set_fact:
    win_workman_wu_report:
      build_before: "{{ win_workman_wu_build_before }}"
      build_after: "{{ win_workman_wu_build }}"
      found: "{{ win_workman_wu_install.found_update_count | default(0) | int }}"
      installed: "{{ win_workman_wu_install.installed_update_count | default(0) | int }}"
      failed: "{{ win_workman_wu_install.failed_update_count | default(0) | int }}"
      reboot_required: "{{ win_workman_wu_install.reboot_required | default(false) | bool }}"
      rebooted: "{{ win_workman_wu_install.rebooted | default(false) | bool }}"
      updates: >-
        {%- set ns = namespace(lines=[]) -%}
        {%- for u in (win_workman_wu_install.updates | default({})).values() -%}
          {%- if u.failure_hresult_code is defined -%}
            {%- set state = 'failed 0x%08X' % (u.failure_hresult_code | int) -%}
          {%- elif u.installed | default(false) -%}
            {%- set state = 'installed' -%}
          {%- elif u.downloaded | default(false) -%}
            {%- set state = 'downloaded' -%}
          {%- else -%}
            {%- set state = 'not installed' -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + ['[' ~ state ~ '] ' ~ u.title ~ (' - ' ~ u.failure_msg if u.failure_msg is defined else '')] -%}
        {%- endfor -%}
        {{ ns.lines }}
      filtered: >-
        {%- set ns = namespace(lines=[]) -%}
        {%- for u in (win_workman_wu_install.filtered_updates | default({})).values() -%}
          {%- set ns.lines = ns.lines + ['[' ~ (u.filtered_reasons | default([]) | join(', ')) ~ '] ' ~ u.title] -%}
        {%- endfor -%}
        {{ ns.lines }}

- name: Report Windows Update result
  ansible.builtin.debug:
    msg: >-
      {{
        [
          'Selection: ' ~ win_workman_wu_selection.label ~ ' ('
            ~ win_workman_wu_selection.categories | join(', ') ~ ')'
            ~ (', optional updates skipped' if win_workman_wu_selection.skip_optional | bool else ''),
          'Build: ' ~ (win_workman_wu_report.build_before
            if win_workman_wu_report.build_before == win_workman_wu_report.build_after
            else win_workman_wu_report.build_before ~ ' -> ' ~ win_workman_wu_report.build_after),
          'Updates: ' ~ win_workman_wu_report.found ~ ' found, '
            ~ win_workman_wu_report.installed ~ ' installed, '
            ~ win_workman_wu_report.failed ~ ' failed',
        ]
        + win_workman_wu_report.updates
        + (['Filtered out:'] + win_workman_wu_report.filtered if win_workman_wu_report.filtered else [])
        + (['Pause had expired before the run: Windows may have installed updates on its own']
            if win_workman_wu_pause_status | int == 2 else [])
        + (['Paused before the run, until ' ~ win_workman_wu_pause_expiry]
            if win_workman_wu_pause_status | int == 1 else [])
        + (['Rebooted by win_updates to complete the install']
            if win_workman_wu_report.rebooted | bool else [])
        + (['Reboot still required: win_workman_restart is false']
            if win_workman_wu_report.reboot_required and not (win_workman_restart | bool) else [])
      }}
